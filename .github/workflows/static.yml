<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrawan | Birthday Celebration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --purple-glow: rgba(168, 85, 247, 0.3);
            --dark-bg: #030308;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
        }

        /* Fullscreen WebGL Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Glowing Nebula */
        .nebula-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            filter: blur(90px);
            opacity: 0.7;
        }

        .nebula-blob {
            position: absolute;
            border-radius: 50%;
            animation: floatNebula 20s infinite alternate ease-in-out;
        }

        .blob-1 { top: -10%; left: -10%; width: 55vw; height: 55vw; background: radial-gradient(circle, rgba(168,85,247,0.3) 0%, transparent 70%); }
        .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(236,72,153,0.25) 0%, transparent 70%); animation-delay: -6s; }
        .blob-3 { top: 35%; left: 30%; width: 45vw; height: 45vw; background: radial-gradient(circle, rgba(255,215,0,0.18) 0%, transparent 70%); animation-delay: -12s; }

        @keyframes floatNebula {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(6%, 8%) scale(1.08); }
            100% { transform: translate(-4%, -4%) scale(0.96); }
        }

        /* Screen Architecture */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            opacity: 0;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* Typography */
        .font-serif-title { font-family: 'Playfair Display', serif; }
        .font-handwriting { font-family: 'Dancing Script', cursive; }

        .glow-gold { text-shadow: 0 0 20px var(--gold-glow), 0 0 40px var(--gold-glow); }
        .glow-text-white { text-shadow: 0 0 30px rgba(255,255,255,0.6); }

        /* Cinematic Glass Button */
        .btn-cinematic {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1.2rem 3.5rem;
            border-radius: 100px;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.95rem;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.4);
            display: inline-flex;
            align-items: center;
            gap: 0.9rem;
            margin-top: 1.5rem;
        }

        .btn-cinematic:hover {
            transform: translateY(-4px) scale(1.05);
            border-color: var(--gold);
            box-shadow: 0 20px 45px rgba(255, 215, 0, 0.4), 0 0 30px var(--gold-glow);
            color: var(--gold);
        }

        /* Glassmorphism Bento Cards */
        .glass-card {
            background: rgba(15, 15, 28, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 1.8rem;
            text-align: left;
            position: relative;
            transition: all 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px var(--gold-glow);
        }

        /* Interactive Cake System */
        .cake-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }

        .candle-flame {
            width: 14px;
            height: 28px;
            background: linear-gradient(to bottom, #ffffff 0%, #ffeb3b 30%, #ff5722 80%, transparent 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 20px #ff9800, 0 0 40px #ff5722;
            animation: flameFlicker 0.15s infinite alternate ease-in-out;
            transform-origin: center bottom;
        }

        @keyframes flameFlicker {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.15) rotate(3deg); }
        }

        /* Mouse Glow Cursor */
        #cursor-glow {
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
        }

        /* Sound Button */
        #sound-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 100;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #sound-toggle:hover {
            transform: scale(1.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Cut Knife Graphic */
        #knife-element {
            position: absolute;
            top: 10px;
            right: -20px;
            font-size: 50px;
            transform: rotate(-45deg);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }
    </style>
</head>
