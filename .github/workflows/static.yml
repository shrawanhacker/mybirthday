    <!-- JAVASCRIPT CODE -->
    <script>
        /* =========================================================
           1. AUDIO ENGINE (Synthesizer, Applause, & Dhoom Dhadka Sound)
           ========================================================= */
        let audioCtx = null;
        let isMuted = false;

        const realApplauseAudio = new Audio('https://actions.google.com/sounds/v1/crowds/applause_cheering.ogg');
        realApplauseAudio.volume = 0.85;

        function initAudioEngine() {
            if (audioCtx) return;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            audioCtx = new AudioCtx();
            
            playAmbientPad();
            playMelodyLoop(0);
        }

        function playAmbientPad() {
            if (!audioCtx) return;
            try {
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc1.type = 'sine';
                osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(130.81, audioCtx.currentTime); // C3
                osc2.frequency.setValueAtTime(196.00, audioCtx.currentTime); // G3

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(320, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start();
                osc2.start();
            } catch(e) {}
        }

        const melodyNotes = [
            { f: 261.63, d: 0.4 }, { f: 261.63, d: 0.3 }, { f: 293.66, d: 0.7 }, { f: 261.63, d: 0.7 }, { f: 349.23, d: 0.7 }, { f: 329.63, d: 1.2 },
            { f: 261.63, d: 0.4 }, { f: 261.63, d: 0.3 }, { f: 293.66, d: 0.7 }, { f: 261.63, d: 0.7 }, { f: 392.00, d: 0.7 }, { f: 349.23, d: 1.2 },
            { f: 261.63, d: 0.4 }, { f: 261.63, d: 0.3 }, { f: 523.25, d: 0.7 }, { f: 440.00, d: 0.7 }, { f: 349.23, d: 0.7 }, { f: 329.63, d: 0.7 }, { f: 293.66, d: 1.2 },
            { f: 466.16, d: 0.4 }, { f: 466.16, d: 0.3 }, { f: 440.00, d: 0.7 }, { f: 349.23, d: 0.7 }, { f: 392.00, d: 0.7 }, { f: 349.23, d: 1.5 }
        ];

        function playMelodyLoop(idx) {
            if (!audioCtx || isMuted) {
                setTimeout(() => playMelodyLoop((idx + 1) % melodyNotes.length), 600);
                return;
            }

            try {
                const note = melodyNotes[idx];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(note.f, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.d + 0.15);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + note.d + 0.15);

                setTimeout(() => {
                    playMelodyLoop((idx + 1) % melodyNotes.length);
                }, (note.d + 0.1) * 1000);
            } catch(e) {
                setTimeout(() => playMelodyLoop((idx + 1) % melodyNotes.length), 600);
            }
        }

        function playChimeSFX(freq = 523.25) {
            if (!audioCtx || isMuted) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {}
        }

        /* REAL CROWD CLAPPING & CHEERING AUDIO */
        function playClappingAndCheeringSound() {
            if (isMuted) return;

            if (realApplauseAudio) {
                try {
                    realApplauseAudio.currentTime = 0;
                    realApplauseAudio.play().catch(() => {
                        playSynthesizedApplause();
                    });
                } catch(e) {
                    playSynthesizedApplause();
                }
            } else {
                playSynthesizedApplause();
            }
        }

        function playSynthesizedApplause() {
            if (!audioCtx || isMuted) return;

            try {
                const bufferSize = audioCtx.sampleRate * 4.0;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.sin(i / 100);
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const bandFilter = audioCtx.createBiquadFilter();
                bandFilter.type = 'bandpass';
                bandFilter.frequency.setValueAtTime(1400, audioCtx.currentTime);
                bandFilter.Q.setValueAtTime(1.0, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.4);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.8);

                noise.connect(bandFilter);
                bandFilter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch(e) {}
        }

        /* DHOOM DHADKA BOMB EXPLOSION SOUND */
        function playDhoomDhadkaBombSound() {
            if (!audioCtx || isMuted) return;
            try {
                // 1. Heavy Sub-Bass Drop ("Dhoom" Punch)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.8);

                gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);

                // 2. White Noise Blast ("Dhadka" Bomb Crash)
                const bufferSize = audioCtx.sampleRate * 2.0;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1.5);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);

                noise.start();
            } catch(e) {}
        }

        function playCelebrationFanfare() {
            if (!audioCtx || isMuted) return;
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                setTimeout(() => {
                    try {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 2.0);
                    } catch(e) {}
                }, i * 150);
            });
        }

        function toggleMute() {
            isMuted = !isMuted;
            const icon = document.getElementById('sound-icon');
            if (isMuted) {
                icon.className = 'fas fa-volume-mute text-gray-400';
                if (audioCtx) audioCtx.suspend();
                if (realApplauseAudio) realApplauseAudio.pause();
            } else {
                icon.className = 'fas fa-volume-up text-yellow-400';
                if (audioCtx) audioCtx.resume();
            }
        }

        /* =========================================================
           2. TYPEWRITER ENGINE
           ========================================================= */
        function typeWriter(elementId, textArray, speed = 40, callback = null) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = "";
            let arrayIdx = 0;
            let charIdx = 0;

            function typeNextChar() {
                if (arrayIdx >= textArray.length) {
                    if (callback) callback();
                    return;
                }

                const currentText = textArray[arrayIdx];
                if (charIdx < currentText.length) {
                    el.innerHTML += currentText.charAt(charIdx);
                    charIdx++;
                    setTimeout(typeNextChar, speed);
                } else {
                    setTimeout(() => {
                        if (arrayIdx < textArray.length - 1) {
                            el.innerHTML = "";
                            charIdx = 0;
                            arrayIdx++;
                            typeNextChar();
                        } else if (callback) {
                            callback();
                        }
                    }, 1800);
                }
            }
            typeNextChar();
        }

        /* =========================================================
           3. THREE.JS 3D BACKGROUND ENGINE
           ========================================================= */
        let threeScene, threeCamera, threeRenderer, starPoints;

        function init3DWorld() {
            const canvas = document.getElementById('bg-canvas');
            if (!canvas || !window.THREE) return;

            try {
                threeScene = new THREE.Scene();
                threeCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                threeCamera.position.z = 7;

                threeRenderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
                threeRenderer.setSize(window.innerWidth, window.innerHeight);
                threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                const count = 3000;
                const pos = new Float32Array(count * 3);
                for(let i = 0; i < count * 3; i++) {
                    pos[i] = (Math.random() - 0.5) * 35;
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.04,
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.8
                });

                starPoints = new THREE.Points(geo, mat);
                threeScene.add(starPoints);

                function animate() {
                    requestAnimationFrame(animate);
                    if (starPoints) {
                        starPoints.rotation.y += 0.0008;
                        starPoints.rotation.x += 0.0004;
                    }
                    threeRenderer.render(threeScene, threeCamera);
                }
                animate();
            } catch(e) {}
        }

        /* =========================================================
           4. SCREEN NAVIGATION & GSAP CONTROLLER
           ========================================================= */
        let activeScreenId = 'screen-start';

        function startMasterJourney() {
            initAudioEngine();
            playChimeSFX(587.33);

            nextScreen('screen-prologue', () => {
                typeWriter('typed-prologue', [
                    "Every life is a beautiful journey...",
                    "A story of growth, passion, and big dreams."
                ], 45, () => {
                    setTimeout(() => {
                        nextScreen('screen-hero', () => {
                            typeWriter('typed-hero', [
                                "Today is not just my birthday.",
                                "Today is a celebration of every dream I've chased.",
                                "Every lesson I've learned, and every win ahead."
                            ], 35);
                        });
                    }, 1200);
                });
            });
        }

        function nextScreen(targetId, onCompleteCallback) {
            playChimeSFX(659.25);
            const currentEl = document.getElementById(activeScreenId);
            const nextEl = document.getElementById(targetId);

            if (!nextEl) return;

            if (window.gsap && currentEl) {
                gsap.to(currentEl, {
                    opacity: 0,
                    scale: 1.08,
                    duration: 0.8,
                    onComplete: () => {
                        currentEl.classList.remove('active');
                        nextEl.classList.add('active');
                        activeScreenId = targetId;

                        gsap.fromTo(nextEl, 
                            { opacity: 0, scale: 0.92 },
                            { opacity: 1, scale: 1, duration: 0.8, onComplete: onCompleteCallback }
                        );
                    }
                });
            } else {
                if (currentEl) currentEl.classList.remove('active');
                nextEl.classList.add('active');
                activeScreenId = targetId;
                if (onCompleteCallback) onCompleteCallback();
            }
        }

        /* =========================================================
           5. CAKE CUTTING & CELEBRATION
           ========================================================= */
        function cutBirthdayCake() {
            playChimeSFX(880);
            playClappingAndCheeringSound();

            const cutBtn = document.getElementById('cut-btn');
            const knife = document.getElementById('knife-element');
            const cake = document.getElementById('cake-box');

            if (cutBtn) cutBtn.style.display = 'none';

            if (knife) {
                knife.style.opacity = '1';
                knife.style.transform = 'translate(-80px, 80px) rotate(-10deg)';
            }

            setTimeout(() => {
                if (window.gsap && cake) {
                    gsap.to(cake, {
                        scale: 1.08,
                        duration: 0.2,
                        repeat: 4,
                        yoyo: true,
                        onComplete: runCountdown
                    });
                } else {
                    runCountdown();
                }
            }, 600);
        }

        function runCountdown() {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-50 flex items-center justify-center font-serif-title font-black text-9xl text-yellow-400 glow-gold bg-black/80 backdrop-blur-md';
            document.body.appendChild(overlay);

            let count = 3;
            overlay.innerText = count;
            playChimeSFX(440);

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    overlay.innerText = count;
                    playChimeSFX(440 + (3 - count) * 150);
                } else {
                    clearInterval(timer);
                    overlay.innerText = "BOOM! 🎉";
                    
                    // Trigger Dhoom Dhadka Bomb Explosion & Fanfare
                    playDhoomDhadkaBombSound();
                    playCelebrationFanfare();
                    playClappingAndCheeringSound();

                    setTimeout(() => {
                        overlay.remove();
                        launchFinaleScreen();
                    }, 800);
                }
            }, 1000);
        }

        function launchFinaleScreen() {
            nextScreen('screen-finale');

            if (window.confetti) {
                const duration = 10 * 1000;
                const end = Date.now() + duration;

                (function frame() {
                    window.confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffd700', '#ec4899', '#3b82f6'] });
                    window.confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffd700', '#ec4899', '#3b82f6'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }

            setTimeout(() => {
                nextScreen('screen-outro');
            }, 14000);
        }

        /* =========================================================
           6. MOUSE TRACKING & INITIALIZATION
           ========================================================= */
        window.addEventListener('mousemove', (e) => {
            const cursor = document.getElementById('cursor-glow');
            if (cursor) {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            }
        });

        window.onload = () => {
            init3DWorld();
        };
    </script>
</body>
</html>
